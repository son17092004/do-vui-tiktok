<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay · Đố Vui LIVE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&family=Lora:ital,wght@0,600;0,700;1,500&display=swap">
<style>
/* 1080×1920 stage scaled to the window, for TikTok LIVE Studio window capture or an OBS browser source.
   TikTok draws its own UI over the top ~200px and the bottom ~650px, so everything that matters sits in y 200–1250. */
:root{
  --bg1:#120a2e; --bg2:#2a0f4a; --bg3:#4a1240;
  --fg:#fff7ea; --muted:#cbb9e6; --gold:#ffc94a; --gold2:#ffe39a; --red:#ff4d6d; --green:#3ee08f; --cyan:#5ce1ff;
  --card:rgba(20,10,46,.82); --line:rgba(255,201,74,.55);
  --display:"Be Vietnam Pro",system-ui,sans-serif; --serif:"Lora",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--display);color:var(--fg)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 18%,var(--bg3) 0%,var(--bg2) 38%,var(--bg1) 75%)}
#bgImg{position:absolute;inset:0;background-size:cover;background-position:center;display:none}
#bgImg.on{display:block}
#bgImg.on::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,5,30,.55),rgba(10,5,30,.35) 40%,rgba(10,5,30,.7))}
/* stage lights + a soft drum pattern, drawn without image files */
.beam{position:absolute;top:-200px;width:340px;height:1500px;background:linear-gradient(180deg,rgba(255,220,140,.22),rgba(255,220,140,0) 75%);
  filter:blur(6px);transform-origin:top center;animation:sweep 9s ease-in-out infinite alternate;mix-blend-mode:screen}
.beam.l{left:60px;--a:-28deg;--b:-8deg}.beam.r{right:60px;--a:28deg;--b:8deg;animation-delay:-4.5s}
.beam.c{left:370px;--a:-6deg;--b:6deg;opacity:.6;animation-duration:12s;background:linear-gradient(180deg,rgba(130,200,255,.18),rgba(130,200,255,0) 70%)}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
#drum{position:absolute;left:50%;top:640px;width:1500px;height:1500px;margin-left:-750px;opacity:.07;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ui{position:absolute;z-index:3}

/* header */
#head{top:200px;left:0;right:0;text-align:center}
#logo{max-height:120px;max-width:620px;display:none;margin:0 auto}
#title{font-weight:900;font-size:104px;line-height:1.08;letter-spacing:.03em;max-width:940px;margin:0 auto;text-wrap:balance;
  background:linear-gradient(180deg,#fff6d0 10%,var(--gold) 55%,#e08a1e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #6b1d5c) drop-shadow(0 0 30px rgba(255,190,80,.45))}
#subtitle{margin-top:10px;font-size:30px;font-weight:600;color:var(--muted);letter-spacing:.02em}

/* round strip */
#strip{top:372px;left:70px;right:70px;height:96px;display:flex;align-items:center;gap:16px}
.chip{height:62px;padding:0 26px;border-radius:999px;display:flex;align-items:center;gap:10px;font-size:30px;font-weight:800;
  background:var(--card);border:2px solid var(--line);white-space:nowrap}
#qno{background:linear-gradient(180deg,#ffd76a,#f0a52a);color:#3a1600;border:none}
#topic{max-width:420px;overflow:hidden;text-overflow:ellipsis}
#stars{color:var(--gold);letter-spacing:4px}
#ai{display:none;font-size:22px;color:var(--cyan);border-color:rgba(92,225,255,.6)}
#timer{margin-left:auto;position:relative;width:110px;height:110px;flex:none}
#timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
#timer circle{fill:none;stroke-width:10}
#timer .track{stroke:rgba(255,255,255,.14)}
#timer .bar{stroke:var(--green);stroke-linecap:round;transition:stroke .3s}
#timer.warn .bar{stroke:var(--gold)}#timer.hot .bar{stroke:var(--red)}
#timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--card);border-radius:50%;margin:12px}
#timer.hot b{animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}

/* question card: flips to the answer */
#card{top:490px;left:60px;right:60px;height:430px;perspective:2000px}
.face{position:absolute;inset:0;border-radius:40px;padding:44px 54px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  backface-visibility:hidden;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
#front{background:linear-gradient(180deg,rgba(40,22,90,.94),rgba(22,10,52,.94));border:3px solid var(--line);
  box-shadow:0 0 0 8px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.5),inset 0 0 80px rgba(255,201,74,.08)}
#back{transform:rotateY(180deg);background:radial-gradient(ellipse at 50% 0%,#2e8c5c,#0f3d2a);border:3px solid #7dffc0;box-shadow:0 0 70px rgba(62,224,143,.45)}
#card.flip #front{transform:rotateY(-180deg)}#card.flip #back{transform:rotateY(0)}
#qtext{font-family:var(--serif);font-weight:700;font-size:64px;line-height:1.28;text-wrap:balance}
#back small{font-size:30px;font-weight:800;letter-spacing:.18em;color:#bfffe0}
#answer{margin-top:14px;font-weight:900;font-size:96px;line-height:1.1;color:#fff;text-shadow:0 4px 0 #0b2c1d}
#answerMeta{margin-top:18px;font-size:30px;color:#d6ffe9}
#card.idle #qtext{font-family:var(--display);font-size:52px}

/* hint */
#hint{top:940px;left:90px;right:90px;text-align:center;font-size:40px;font-weight:700;color:var(--gold2);opacity:0;transform:translateY(10px);transition:.5s}
#hint.show{opacity:1;transform:none}
#hint span{letter-spacing:.08em;font-variant-numeric:tabular-nums}

/* fastest answers */
#podium{top:1010px;left:90px;right:90px;display:grid;gap:12px}
.win{height:70px;border-radius:20px;display:flex;align-items:center;gap:16px;padding:0 22px;font-size:34px;font-weight:800;
  background:var(--card);border:2px solid var(--line);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.win .medal{font-size:40px}.win .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .pt{color:var(--green);font-variant-numeric:tabular-nums}.win .x{font-size:24px;color:#3a1600;background:var(--gold);border-radius:999px;padding:2px 12px}
.win img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.win.more{height:52px;font-size:26px;justify-content:center;color:var(--muted);font-weight:600}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* leaderboard */
#board{top:470px;left:60px;right:60px;padding:34px 40px;border-radius:40px;background:linear-gradient(180deg,rgba(40,22,90,.96),rgba(22,10,52,.96));
  border:3px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);opacity:0;transform:scale(.92);transition:.5s;pointer-events:none;z-index:6}
#board.show{opacity:1;transform:none}
#board h2{margin:0 0 18px;text-align:center;font-size:52px;font-weight:900;color:var(--gold)}
#board ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#board li{display:flex;align-items:center;gap:16px;height:64px;padding:0 20px;border-radius:18px;background:rgba(255,255,255,.06);font-size:32px;font-weight:700}
#board li:nth-child(1){background:linear-gradient(90deg,rgba(255,201,74,.38),rgba(255,201,74,.08));font-size:38px;height:76px}
#board li:nth-child(2){background:linear-gradient(90deg,rgba(220,220,240,.28),rgba(220,220,240,.06))}
#board li:nth-child(3){background:linear-gradient(90deg,rgba(224,140,80,.3),rgba(224,140,80,.06))}
#board .rk{width:52px;text-align:center;color:var(--gold2);font-variant-numeric:tabular-nums}
#board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board .sc{color:var(--gold2);font-variant-numeric:tabular-nums}
#board img{width:46px;height:46px;border-radius:50%;object-fit:cover}
#board .empty{justify-content:center;color:var(--muted);background:none}
#board .bst{font-size:22px;background:var(--gold);color:#3a1600;border-radius:999px;padding:2px 10px}

/* side info (lower area: may sit under TikTok's comments, so nothing critical here) */
#guesses{top:1290px;left:40px;right:40px;height:150px;overflow:hidden;display:flex;flex-wrap:wrap-reverse;gap:10px;align-content:flex-start;justify-content:center}
.gs{font-size:26px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.1);color:#e9defa;animation:fadeup 4s forwards;white-space:nowrap;max-width:460px;overflow:hidden;text-overflow:ellipsis}
.gs b{color:var(--muted);font-weight:600}
.gs.chat{background:rgba(255,255,255,.92);color:#1b0b33;font-weight:700;animation-duration:6s;border:3px solid var(--tc,#fff)}
.gs.chat b{color:#5a3d8a}
.gs.nudge{background:rgba(255,201,74,.22);color:var(--gold2);font-weight:700;max-width:1000px;white-space:normal;text-align:center}
.say{position:absolute;z-index:7;max-width:330px;transform:translate(-50%,-100%);background:#fff;color:#1b0b33;font-size:25px;font-weight:700;line-height:1.22;
  padding:8px 16px 10px;border-radius:20px;border:4px solid var(--tc,#fff);box-shadow:0 8px 24px rgba(0,0,0,.45);overflow-wrap:anywhere;text-align:left;
  animation:sayIn .35s cubic-bezier(.2,1.6,.4,1),sayOut .4s 5.6s forwards}
.say small{display:block;font-size:18px;font-weight:800;color:var(--tc,#5a3d8a);filter:brightness(.8)}
.say::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--tc,#fff);border-bottom:0}
.say.below{transform:translate(-50%,0)}.say.below::after{bottom:auto;top:-14px;border-top:0;border-bottom:10px solid var(--tc,#fff)}
@keyframes sayIn{from{opacity:0;scale:.5}}@keyframes sayOut{to{opacity:0;scale:.8}}
@keyframes fadeup{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#how{top:1460px;left:0;right:0;text-align:center;font-size:30px;font-weight:700;color:var(--muted)}
#how b{color:var(--gold2)}
#host{position:absolute;z-index:2;right:10px;bottom:430px;max-height:420px;display:none;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}

/* gift banner */
#gift{top:200px;left:60px;right:60px;z-index:8;padding:28px 34px;border-radius:32px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,#a2236a,#3b0b3f);border:3px solid var(--gold2);box-shadow:0 0 70px rgba(255,120,200,.5);
  opacity:0;transform:translateY(-30px) scale(.9);transition:.45s cubic-bezier(.2,1.4,.4,1)}
#gift.show{opacity:1;transform:none}
#gift .who{font-size:52px;font-weight:900;color:var(--gold2)}#gift .what{font-size:34px;margin-top:6px}
#gift .bst{display:inline-block;margin-top:12px;font-size:30px;font-weight:900;color:#3a1600;background:var(--gold);border-radius:999px;padding:6px 22px}
#gift img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--gold2);margin-bottom:8px}

#fx{position:absolute;inset:0;z-index:7;pointer-events:none}
#unmute{position:absolute;z-index:9;left:50%;top:1600px;transform:translateX(-50%);font:800 38px var(--display);padding:24px 48px;border-radius:24px;
  border:3px solid var(--gold2);background:#7a1fa2;color:#fff;cursor:pointer;white-space:nowrap}
#conn{position:absolute;z-index:9;right:16px;bottom:12px;font-size:20px;color:var(--muted);opacity:.7}
/* ---- team ladder mode: smaller question card, staircases from y 760 to 1262 ---- */
.teamOnly{display:none}
#stage.team .teamOnly{display:flex}
#stage [hidden]{display:none!important}
#stage.team #stars{display:none}#stage.team #topic{max-width:250px}
#stage.team #podium,#stage.team #board{display:none}
#stage.team #card{top:470px;height:205px}
#stage.team .face{padding:24px 40px;border-radius:30px}
#stage.team #answer{font-size:72px!important;margin-top:4px}
#stage.team #back small{font-size:24px}#stage.team #answerMeta{font-size:26px;margin-top:8px}
#stage.team #hint{top:684px;font-size:32px}
#tcount{color:var(--green)}
#clock{font-variant-numeric:tabular-nums}
#stairs{top:738px;left:24px;right:24px;height:392px;gap:14px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:24px;background:rgba(10,5,30,.45);border:2px solid color-mix(in srgb,var(--tc) 60%,transparent);overflow:hidden}
.col.lead{box-shadow:0 0 0 3px var(--tc),0 0 40px color-mix(in srgb,var(--tc) 50%,transparent)}
.thead{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 55%,transparent),color-mix(in srgb,var(--tc) 20%,transparent))}
.thead .ic{width:40px;height:40px;border-radius:50%;flex:none;background:var(--tc);display:grid;place-items:center;font-size:26px;font-weight:900;color:#1b0b33;overflow:hidden}
.thead .ic img{width:100%;height:100%;object-fit:contain}
.thead .nm{font-size:30px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead .meta{text-align:right;font-size:20px;line-height:1.15;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.thead .meta b{font-size:26px;display:block}
.ladder{position:relative;flex:1}
.stp{position:absolute;left:50%;transform:translateX(-50%);border-radius:8px 8px 4px 4px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 70%,#fff 10%),color-mix(in srgb,var(--tc) 35%,#000 30%));box-shadow:0 3px 0 rgba(0,0,0,.35)}
.stp.img{background-size:100% 100%;background-color:transparent;box-shadow:none}
.stp.top{box-shadow:0 0 18px var(--tc)}
.goal{position:absolute;left:50%;transform:translate(-50%,-100%);font-size:40px;line-height:1}
.goal img{height:56px;display:block}
.avg{position:absolute;left:4px;transform:translateY(-50%);font-size:18px;font-weight:900;color:#1b0b33;background:var(--tc);border-radius:0 999px 999px 0;padding:2px 10px 2px 6px;transition:top .8s cubic-bezier(.3,1.3,.5,1);z-index:3;white-space:nowrap}
.pl{position:absolute;border-radius:50%;border:3px solid var(--tc);background:#1b0b33;display:grid;place-items:center;overflow:hidden;font-weight:900;color:#fff;
  transition:left .7s cubic-bezier(.3,1.4,.5,1),top .7s cubic-bezier(.3,1.4,.5,1);z-index:2;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.pl img{width:100%;height:100%;object-fit:cover}
.pl.up{animation:up 1.2s}.pl.down{animation:down .9s}
@keyframes up{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.5)}30%{box-shadow:0 0 0 6px var(--green),0 0 30px var(--green);transform:scale(1.35)}}
@keyframes down{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}30%{box-shadow:0 0 0 6px var(--red)}}
.more{position:absolute;transform:translate(-50%,-50%);font-size:18px;font-weight:900;background:#fff;color:#1b0b33;border-radius:999px;padding:1px 8px;z-index:3}
/* audience: commenters who aren't in a team, two rows of seats */
#stands{top:1140px;left:24px;right:24px;height:150px;display:block;border-radius:22px;
  background:linear-gradient(180deg,transparent 30px,rgba(255,255,255,.05) 30px,rgba(255,255,255,.05) 82px,transparent 82px,transparent 88px,rgba(255,255,255,.07) 88px,rgba(255,255,255,.07) 140px,transparent 140px)}
#audHead{position:absolute;left:14px;top:2px;font-size:21px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.au{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:#2a1a50;overflow:hidden;
  display:grid;place-items:center;font-size:19px;font-weight:800;color:#e9defa;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.au img{width:100%;height:100%;object-fit:cover}
.au.more{border-style:dashed;font-size:16px;background:rgba(255,255,255,.08)}
#matchEnd{top:470px;left:60px;right:60px;padding:34px 40px;border-radius:40px;z-index:6;text-align:center;
  background:linear-gradient(180deg,rgba(40,22,90,.97),rgba(22,10,52,.97));border:3px solid var(--gold);box-shadow:0 30px 80px rgba(0,0,0,.6);
  opacity:0;transform:scale(.9);transition:.5s;pointer-events:none}
#matchEnd.show{opacity:1;transform:none}
#matchEnd h2{margin:0;font-size:60px;font-weight:900;color:var(--gold)}
#matchEnd .sub{font-size:28px;color:var(--muted);margin:6px 0 20px}
#meRows{display:grid;gap:12px}
.mer{display:flex;align-items:center;gap:16px;height:76px;padding:0 22px;border-radius:20px;background:color-mix(in srgb,var(--tc) 22%,transparent);border:2px solid var(--tc);font-size:34px;font-weight:800}
.mer .rk{width:50px}.mer .nm{flex:1;text-align:left}.mer .v{font-variant-numeric:tabular-nums}.mer small{font-size:22px;color:var(--muted);font-weight:600}
#meMvp{margin-top:20px;font-size:32px;font-weight:800;color:var(--gold2)}
#meNext{margin-top:14px;font-size:28px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.beam,#drum{animation:none}.face,#board,#gift,#hint,#matchEnd{transition:none}.pl{transition:none;animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="bgImg"></div>
  <div class="beam l"></div><div class="beam c"></div><div class="beam r"></div>
  <svg id="drum" viewBox="-100 -100 200 200" aria-hidden="true">
    <g fill="none" stroke="#ffd36a" stroke-width=".6">
      <circle r="98"/><circle r="90"/><circle r="74"/><circle r="58"/><circle r="40"/><circle r="22"/><circle r="12"/>
    </g>
    <g fill="#ffd36a" id="rays"></g>
    <g fill="none" stroke="#ffd36a" stroke-width=".5" id="ticks"></g>
  </svg>
  <img id="host" alt="">

  <div id="head" class="ui"><img id="logo" alt=""><div id="title">ĐỐ VUI</div><div id="subtitle">Bình luận đáp án · ai nhanh nhất được nhiều điểm</div></div>

  <div id="strip" class="ui">
    <div class="chip" id="qno">Câu –</div>
    <div class="chip" id="topic">Đố vui</div>
    <div class="chip" id="stars">★</div>
    <div class="chip" id="ai">✨ AI</div>
    <div class="chip teamOnly" id="clock">⏳ –</div>
    <div class="chip teamOnly" id="tcount" hidden>✓ 0</div>
    <div id="timer"><svg viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="48"/><circle class="bar" cx="55" cy="55" r="48" stroke-dasharray="301.6" stroke-dashoffset="0"/></svg><b id="sec">–</b></div>
  </div>

  <div id="card" class="ui idle">
    <div class="face" id="front"><div id="qtext">Sắp bắt đầu…</div></div>
    <div class="face" id="back"><small>ĐÁP ÁN</small><div id="answer"></div><div id="answerMeta"></div></div>
  </div>
  <div id="hint" class="ui">💡 Gợi ý: <span id="hintText"></span></div>
  <div id="podium" class="ui"></div>
  <div id="board" class="ui"><h2>🏆 BẢNG VÀNG HÔM NAY</h2><ol id="boardList"></ol></div>
  <div id="stairs" class="ui teamOnly"></div>
  <div id="stands" class="ui teamOnly"><div id="audHead">👀 KHÁN ĐÀI</div></div>
  <div id="matchEnd" class="ui"><h2 id="meTitle"></h2><div class="sub" id="meSub"></div><div id="meRows"></div><div id="meMvp"></div><div id="meNext"></div></div>
  <div id="guesses" class="ui"></div>
  <div id="how" class="ui">💬 Gõ <b>đáp án</b> vào bình luận · 🎁 Tặng quà <b>nhân điểm 10 phút</b></div>
  <div id="gift" class="ui"><img id="giftAv" alt="" hidden><div class="who" id="giftWho"></div><div class="what" id="giftWhat"></div><div class="bst" id="giftBoost" hidden></div></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <button id="unmute">🔊 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
</div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage');
function fit(){ const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

// drum-face ornament: rays + ticks generated once
(() => { const rays = $('rays'), ticks = $('ticks'); const ns = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 14; i++){ const p = document.createElementNS(ns, 'path'); p.setAttribute('d', 'M0 -38 L3 -14 L0 -20 L-3 -14Z'); p.setAttribute('transform', `rotate(${i * 360 / 14})`); rays.append(p); }
  for (let i = 0; i < 48; i++){ const l = document.createElementNS(ns, 'path'); l.setAttribute('d', 'M0 -74 L0 -88'); l.setAttribute('transform', `rotate(${i * 7.5})`); ticks.append(l); } })();

/* =========================== state =========================== */

  musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value, t); musicGain.gain.linearRampToValueAtTime(on ? base * .3 : base, t + .3); }
function tone(f, type, a, d, when = 0, slide){
  if (!AC) return; const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + d);
  o.connect(g); g.connect(sfx); o.start(t); o.stop(t + d + .05);
}
const tick = () => tone(1400, 'square', .06, .05);
const ding = big => { tone(big ? 1046 : 880, 'sine', .3, .5); tone(big ? 1568 : 1320, 'sine', .18, .6, .07); };
const chime = () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 'triangle', .22, .7, i * .09));
const fanfare = tier => { const n = [392, 523, 659, 784, 1046].slice(0, 2 + tier); n.forEach((f, i) => tone(f, 'sawtooth', .07, .35, i * .1)); n.forEach((f, i) => tone(f * 2, 'sine', .1, .5, i * .1)); };
// server voice lines, one after another; dropped while sound is still off so they don't pile up
const ttsQ = []; let ttsPlaying = false;
function queueTTS(url){ if (!AC) return; if (ttsQ.length > 6) ttsQ.shift(); ttsQ.push(url); playTTS(); }
function playTTS(){
  if (ttsPlaying || !ttsQ.length) return; ttsPlaying = true;
  const el = new Audio(ttsQ.shift()), g = AC.createGain(); g.gain.value = 1.3;
  AC.createMediaElementSource(el).connect(g); g.connect(master);
  const done = () => { duck(false); ttsPlaying = false; setTimeout(playTTS, 250); };
  el.onplay = () => duck(true); el.onended = done; el.onerror = done;
  el.play().catch(done);
}

/* =========================== particles =========================== */
const cv = $('fx'), ctx = cv.getContext('2d'), parts = [];
const COLORS = ['#ffc94a', '#ff4d6d', '#5ce1ff', '#3ee08f', '#c77dff', '#fff'];
function confetti(n){ for (let i = 0; i < n; i++) parts.push({ x: 540 + (Math.random() - .5) * 900, y: 160 + Math.random() * 200, vx: (Math.random() - .5) * 260, vy: 100 + Math.random() * 300,
  r: Math.random() * 6.3, vr: (Math.random() - .5) * 10, w: 12 + Math.random() * 10, h: 6 + Math.random() * 8, c: COLORS[i % COLORS.length], life: 3 + Math.random() * 2, t: 0, kind: 'c' }); }
function burst(x, y, n){ for (let i = 0; i < n; i++){ const a = Math.random() * 6.3, v = 200 + Math.random() * 400; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .9, t: 0, c: COLORS[i % COLORS.length], kind: 's', s: 4 + Math.random() * 5 }); } }
function hearts(n){ for (let i = 0; i < n; i++) parts.push({ x: 940 + (Math.random() - .5) * 120, y: 1260, vx: (Math.random() - .5) * 60, vy: -(180 + Math.random() * 160), life: 2.2, t: 0, kind: 'h', s: 30 + Math.random() * 24 }); }
let last = performance.now();
(function loop(t){
  requestAnimationFrame(loop); const dt = Math.min(.05, (t - last) / 1000); last = t;
  ctx.clearRect(0, 0, 1080, 1920);
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.t += dt; if (p.t > p.life){ parts.splice(i, 1); continue; }
    const a = Math.min(1, (p.life - p.t) * 2);
    if (p.kind === 'c'){ p.vy += 260 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore(); }
    else if (p.kind === 's'){ p.vx *= .92; p.vy *= .92; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1; }
    else { p.x += (p.vx + Math.sin(p.t * 4 + i) * 40) * dt; p.y += p.vy * dt;
      ctx.globalAlpha = a; ctx.fillStyle = '#ff4d8d'; ctx.font = `${p.s}px serif`; ctx.textAlign = 'center'; ctx.fillText('♥', p.x, p.y); ctx.globalAlpha = 1; }
  }
})(last);

/* =========================== server link =========================== */
function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws?role=overlay`), st = $('conn');
  ws.onopen = () => { st.textContent = ''; };
  ws.onclose = () => { st.textContent = 'mất kết nối server… đang thử lại'; setTimeout(connect, 2000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    switch (m.t){
      case 'state': setClock(m.now); settings = m.settings; applySettings(); applyAssets(m.assets); hideMatchEnd();
        if (m.match) setTeams(m.match);
        audience.clear(); for (const a of m.audience || []) audience.set(a.uid, a); renderAudience();
        if (m.matchEnd){ idle(' '); showMatchEnd(m.matchEnd, true); break; }
        if (m.lobby){ showLobby(m.lobby); break; }
        if (m.round){ showQuestion(m.round); m.correct.forEach(c => addWinner(c, true)); if (m.tcount) setTcount(m.tcount); }
        else if (m.reveal){ showQuestion(m.reveal); m.reveal.winners.forEach((c, rank) => addWinner({ ...c, rank }, true)); reveal(m.reveal, true); }
        else if (m.phase === 'board'){ idle(' '); showBoard(m.top); }
        else idle(m.running ? 'Câu hỏi tiếp theo sắp tới…' : null);
        break;
      case 'settings': settings = m.settings; applySettings(); if (phase === 'idle') idle(); break;
      case 'question': setClock(m.now); hideMatchEnd(); showQuestion(m); break;
      case 'teams': setTeams(m.match); hideMatchEnd(); break;
      case 'tjoin': onJoin(m); break;
      case 'tcount': setTcount(m); break;
      case 'climb': onClimb(m); break;
      case 'matchEnd': setClock(m.now); showMatchEnd(m); break;
      case 'endsAt': setClock(m.now); endsAt = m.endsAt; break;
      case 'hint': setHint(m.hint); break;
      case 'correct': addWinner(m); break;
      case 'guess': guess(m); break;
      case 'nudge': guess({ text: m.text }, 'nudge', 5000); break;
      case 'chat': chatBubble(m); break;
      case 'lobby': showLobby(m); break;
      case 'aud': onAud(m); break;
      case 'reveal': reveal(m); break;
      case 'leaderboard': showBoard(m.top); break;
      case 'idle': idle(); break;
      case 'gift': showGift(m); break;
      case 'like': hearts(m.n); break;
      case 'tts': queueTTS(m.url); break;
    }
  };
}
if (window.obsstudio){ $('unmute').remove(); startAudio(); }   // OBS browser source allows autoplay; no button on stream
connect();
